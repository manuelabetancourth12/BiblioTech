{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg p-4 mt-4">
            <h3 class="text-center fw-bold mb-4">Iniciar Sesión</h3>
            <form method="post">
                {% csrf_token %}
                {% bootstrap_form form %}
                <button type="submit" class="btn btn-primary w-100 mt-3">Ingresar</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
