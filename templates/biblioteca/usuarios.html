{% extends 'base.html' %}
{% block contenido %}
<div class="bg-white border border-pink-50 rounded-2xl p-6 shadow-sm">
    <h3 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2"><i data-lucide="user-check" class="text-purple-400"></i> Usuarios Registrados</h3>
    <ul class="divide-y divide-slate-50 m-0 text-sm">
        {% for usuario in usuarios %}
            <li class="py-3 flex justify-between items-center">
                <span class="font-medium text-slate-700">{{ usuario.username }}</span>
                <span class="text-xs px-2 py-0.5 rounded-full {% if usuario.is_staff %}bg-pink-100 text-pink-600{% else %}bg-slate-100 text-slate-500{% endif %}">
                    {% if usuario.is_staff %}Administrador{% else %}Cliente{% endif %}
                </span>
            </li>
        {% endfor %}
    </ul>
</div>
<script>lucide.createIcons();</script>
{% endblock %}
